<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dicionário dos Memes</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            padding: 30px;
            text-align: center;
            background: #181818;
            border-bottom: 1px solid #2a2a2a;
            position: relative;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
        }

        #total {
            color: #aaa;
            font-size: 1rem;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px;
        }

        .search {
            width: 100%;
            padding: 15px 18px;
            border-radius: 10px;
            border: 1px solid #333;
            font-size: 18px;
            margin-bottom: 15px;
            background: #222;
            color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        .search:focus {
            border-color: #666;
        }

        .search::placeholder {
            color: #777;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #292929;
            color: white;
            font-size: 15px;
            transition: all 0.2s;
        }

        button:hover {
            background: #444;
        }

        button.active {
            background: #4a6fa5;
            box-shadow: 0 0 0 2px #6b9bd666;
        }

        #grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .card {
            background: #1d1d1d;
            border-radius: 12px;
            padding: 18px;
            border: 1px solid #333;
            transition: 0.2s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: #777;
            background: #222;
        }

        .card:active {
            transform: translateY(-1px);
        }

        .number {
            color: #777;
            font-size: 12px;
        }

        .name {
            margin-top: 8px;
            font-size: 17px;
            font-weight: bold;
            word-break: break-word;
        }

        .category {
            margin-top: 10px;
            font-size: 12px;
            color: #aaa;
            display: inline-block;
            padding: 3px 8px;
            background: #2a2a2a;
            border-radius: 6px;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #777;
            font-size: 16px;
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #aaa;
            font-size: 16px;
        }

        .error {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #ff6b6b;
            font-size: 16px;
        }

        /* ============================================ */
        /* CABEÇALHO DO USUÁRIO LOGADO */
        /* ============================================ */

        .user-bar {
            position: absolute;
            top: 18px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #ccc;
        }

        .user-bar button {
            padding: 6px 12px;
            font-size: 13px;
            background: #3a2323;
        }

        .user-bar button:hover {
            background: #5a2f2f;
        }

        /* ============================================ */
        /* TELA DE LOGIN / CADASTRO */
        /* ============================================ */

        #auth-overlay {
            position: fixed;
            inset: 0;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        #auth-overlay.hidden {
            display: none;
        }

        .auth-box {
            width: 100%;
            max-width: 380px;
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 14px;
            padding: 32px;
        }

        .auth-box h2 {
            margin: 0 0 6px;
            text-align: center;
        }

        .auth-subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .auth-box label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
        }

        .auth-box .search {
            margin-bottom: 16px;
        }

        .auth-submit {
            width: 100%;
            padding: 13px;
            background: #4a6fa5;
            font-size: 16px;
            font-weight: bold;
            margin-top: 4px;
        }

        .auth-submit:hover {
            background: #5a82bd;
        }

        .auth-submit:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .auth-toggle {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #999;
        }

        .auth-toggle a {
            color: #6b9bd6;
            cursor: pointer;
            text-decoration: underline;
        }

        .auth-message {
            min-height: 18px;
            text-align: center;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .auth-message.error {
            color: #ff6b6b;
        }

        .auth-message.success {
            color: #7bd67b;
        }

        #app-content.hidden {
            display: none;
        }

    </style>
</head>


<body>


<!-- ====================================== -->
<!-- TELA DE LOGIN / CADASTRO -->
<!-- ====================================== -->

<div id="auth-overlay" class="hidden">

    <div class="auth-box">

        <h2 id="auth-title">Entrar</h2>

        <div id="auth-subtitle" class="auth-subtitle">
            Faça login para ver os memes
        </div>

        <div id="auth-message" class="auth-message"></div>

        <form id="auth-form" autocomplete="on">

            <label for="auth-username">E-mail</label>

            <input
                id="auth-username"
                class="search"
                type="email"
                placeholder="seuemail@exemplo.com"
                autocomplete="email"
                required
            >

            <label for="auth-password">Senha</label>

            <input
                id="auth-password"
                class="search"
                type="password"
                placeholder="Sua senha"
                autocomplete="current-password"
                required
            >

            <div id="auth-confirm-wrap" style="display: none;">

                <label for="auth-confirm">Confirmar senha</label>

                <input
                    id="auth-confirm"
                    class="search"
                    type="password"
                    placeholder="Confirme sua senha"
                    autocomplete="new-password"
                >

            </div>

            <button
                id="auth-submit-btn"
                type="submit"
                class="auth-submit"
            >
                Entrar
            </button>

        </form>

        <div class="auth-toggle">

            <span id="auth-toggle-login-text">
                Ainda não tem conta?
                <a id="auth-toggle-link">Cadastre-se</a>
            </span>

        </div>

    </div>

</div>


<!-- ====================================== -->
<!-- CONTEÚDO PRINCIPAL DO SITE -->
<!-- ====================================== -->

<div id="app-content" class="hidden">


    <header>

        <h1>
            📂🌐 Todos os Memes 🌐📂
        </h1>

        <div id="total">
            Carregando...
        </div>

        <div class="user-bar">

            <span id="user-label"></span>

            <button id="logout-btn" type="button">
                Sair
            </button>

        </div>

    </header>


    <div class="container">


        <!-- ====================================== -->
        <!-- PESQUISA -->
        <!-- ====================================== -->

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Pesquisar Memes..."
            aria-label="Pesquisar Memes"
            autocomplete="off"
        >


        <!-- ====================================== -->
        <!-- FILTROS -->
        <!-- ====================================== -->

        <div
            class="filters"
            role="group"
            aria-label="Filtros por categoria"
        >

            <button
                data-category="all"
                class="active"
            >
                Todos
            </button>

            <button data-category="common">
                Common
            </button>

            <button data-category="rare">
                Rare
            </button>

            <button data-category="epic">
                Epic
            </button>

            <button data-category="legendary">
                Legendary
            </button>

            <button data-category="mythic">
                Mythic
            </button>

            <button data-category="brainrot_god">
                Brainrot God
            </button>

            <button data-category="secret">
                Secret
            </button>

            <button data-category="og">
                OG
            </button>

        </div>


        <!-- ====================================== -->
        <!-- LISTA -->
        <!-- ====================================== -->

        <div id="grid"></div>


    </div>

</div>


<script>

    // ============================================
    // VARIÁVEIS
    // ============================================

    let allBrainrots = [];

    let currentList = [];

    let currentCategory = "all";

    let authMode = "login"; // "login" ou "register"


    const totalEl =
        document.getElementById("total");

    const gridEl =
        document.getElementById("grid");

    const searchEl =
        document.getElementById("search");

    const categoryButtons =
        document.querySelectorAll(
            "[data-category]"
        );

    const authOverlay =
        document.getElementById("auth-overlay");

    const appContent =
        document.getElementById("app-content");

    const authForm =
        document.getElementById("auth-form");

    const authTitle =
        document.getElementById("auth-title");

    const authSubtitle =
        document.getElementById("auth-subtitle");

    const authMessage =
        document.getElementById("auth-message");

    const authUsername =
        document.getElementById("auth-username");

    const authPassword =
        document.getElementById("auth-password");

    const authConfirmWrap =
        document.getElementById("auth-confirm-wrap");

    const authConfirm =
        document.getElementById("auth-confirm");

    const authSubmitBtn =
        document.getElementById("auth-submit-btn");

    const authToggleText =
        document.getElementById("auth-toggle-login-text");

    const authToggleLink =
        document.getElementById("auth-toggle-link");

    const userLabel =
        document.getElementById("user-label");

    const logoutBtn =
        document.getElementById("logout-btn");


    // ============================================
    // MOSTRAR TELA DE LOGIN OU O SITE
    // ============================================

    function showAuthScreen() {

        authOverlay.classList.remove("hidden");

        appContent.classList.add("hidden");

    }


    function showApp(username) {

        authOverlay.classList.add("hidden");

        appContent.classList.remove("hidden");

        userLabel.textContent =
            `👤 ${username}`;

        loadData();

    }


    // ============================================
    // ALTERNAR ENTRE LOGIN E CADASTRO
    // ============================================

    function setAuthMode(mode) {

        authMode = mode;

        authMessage.textContent = "";

        authMessage.className = "auth-message";

        if (mode === "register") {

            authTitle.textContent = "Criar Conta";

            authSubtitle.textContent =
                "Cadastre-se para ver os memes";

            authConfirmWrap.style.display = "block";

            authConfirm.required = true;

            authSubmitBtn.textContent = "Cadastrar";

            authToggleText.innerHTML =
                'Já tem conta? <a id="auth-toggle-link">Entrar</a>';

        } else {

            authTitle.textContent = "Entrar";

            authSubtitle.textContent =
                "Faça login para ver os memes";

            authConfirmWrap.style.display = "none";

            authConfirm.required = false;

            authSubmitBtn.textContent = "Entrar";

            authToggleText.innerHTML =
                'Ainda não tem conta? <a id="auth-toggle-link">Cadastre-se</a>';

        }

        // Precisa religar o listener pois o link foi recriado
        document
            .getElementById("auth-toggle-link")
            .addEventListener("click", () => {

                setAuthMode(
                    authMode === "login" ? "register" : "login"
                );

            });

    }


    // ============================================
    // VERIFICAR SE JÁ ESTÁ LOGADO
    // ============================================

    async function checkSession() {

        try {

            const response =
                await fetch("/api/session");

            const data =
                await response.json();

            if (data.logged_in) {

                showApp(data.email);

            } else {

                showAuthScreen();

            }

        } catch (err) {

            console.error(err);

            showAuthScreen();

        }

    }


    // ============================================
    // ENVIAR FORMULÁRIO DE LOGIN / CADASTRO
    // ============================================

    authForm.addEventListener("submit", async (e) => {

        e.preventDefault();

        const username =
            authUsername.value.trim();

        const password =
            authPassword.value;

        authMessage.textContent = "";

        authMessage.className = "auth-message";

        if (authMode === "register") {

            const confirm =
                authConfirm.value;

            if (password !== confirm) {

                authMessage.textContent =
                    "As senhas não conferem.";

                authMessage.className =
                    "auth-message error";

                return;

            }

        }

        const endpoint =
            authMode === "register"
                ? "/api/register"
                : "/api/login";

        authSubmitBtn.disabled = true;

        try {

            const response =
                await fetch(endpoint, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: username,
                        password
                    })

                });

            const data =
                await response.json();

            if (!response.ok) {

                authMessage.textContent =
                    data.error || "Ocorreu um erro.";

                authMessage.className =
                    "auth-message error";

                return;

            }

            authForm.reset();

            showApp(data.email);

        } catch (err) {

            console.error(err);

            authMessage.textContent =
                "Não foi possível conectar ao servidor.";

            authMessage.className =
                "auth-message error";

        } finally {

            authSubmitBtn.disabled = false;

        }

    });


    // ============================================
    // LOGOUT
    // ============================================

    logoutBtn.addEventListener("click", async () => {

        try {

            await fetch("/api/logout", {
                method: "POST"
            });

        } catch (err) {

            console.error(err);

        }

        authUsername.value = "";

        authPassword.value = "";

        setAuthMode("login");

        showAuthScreen();

    });


    // ============================================
    // LOADING
    // ============================================

    function showLoading(
        message = "Carregando..."
    ) {

        gridEl.innerHTML = `
            <div class="loading">
                ${message}
            </div>
        `;

    }


    // ============================================
    // ERRO
    // ============================================

    function showError(
        message = "Erro ao carregar os dados."
    ) {

        gridEl.innerHTML = `
            <div class="error">
                ❌ ${message}
            </div>
        `;

    }


    // ============================================
    // ESCAPAR HTML
    // ============================================

    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


    // ============================================
    // TRATAR RESPOSTA NÃO AUTORIZADA (SESSÃO EXPIROU)
    // ============================================

    function tratarNaoAutorizado(response) {

        if (response.status === 401) {

            setAuthMode("login");

            showAuthScreen();

            return true;

        }

        return false;

    }


    // ============================================
    // ENVIAR DADOS PARA O FLASK
    // ============================================

    async function registrarDado(dados) {

        try {

            const response =
                await fetch(
                    "/api/gravar",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            pesquisa:
                                dados.pesquisa || "",

                            brainrot_clicado:
                                dados.brainrot_clicado || ""

                        })
                    }
                );


            if (!response.ok) {

                if (tratarNaoAutorizado(response)) {
                    return;
                }

                console.error(
                    "Erro ao gravar dados:",
                    response.status
                );

                return;

            }


            const resultado =
                await response.json();


            console.log(
                "✅ Dados registrados:",
                resultado
            );


        } catch (erro) {

            console.error(
                "❌ Erro ao enviar dados para o Flask:",
                erro
            );

        }

    }


    // ============================================
    // RENDERIZAR BRAINROTS
    // ============================================

    function render(lista) {

        gridEl.innerHTML = "";


        if (!lista.length) {

            gridEl.innerHTML = `
                <div class="empty">
                    Nenhum meme encontrado 😕
                </div>
            `;

            return;

        }


        lista.forEach((item, index) => {


            /*
             * O Flask atualmente retorna strings:
             *
             * "Noobini Pizzanini"
             *
             * Por isso usamos:
             *
             * item.name || item
             */

            const nomeBrainrot =
                item.name || item;


            const card =
                document.createElement("div");


            card.className =
                "card";


            // ====================================
            // CLIQUE NO BRAINROT
            // ====================================

            card.addEventListener(
                "click",
                () => {

                    const pesquisaAtual =
                        searchEl.value.trim();


                    registrarDado({

                        pesquisa:
                            pesquisaAtual,

                        brainrot_clicado:
                            nomeBrainrot

                    });

                }
            );


            // ====================================
            // CONTEÚDO DO CARD
            // ====================================

            card.innerHTML = `

                <div class="number">
                    #${index + 1}
                </div>

                <div class="name">
                    ${escapeHtml(nomeBrainrot)}
                </div>

                ${
                    item.category
                    ?
                    `
                    <div class="category">
                        ${escapeHtml(
                            item.category
                        )}
                    </div>
                    `
                    :
                    ""
                }

            `;


            gridEl.appendChild(card);


        });

    }


    // ============================================
    // PESQUISA LOCAL
    // ============================================

    function applySearch(query) {

        const term =
            query.trim().toLowerCase();


        if (!term) {

            render(currentList);

            return;

        }


        const resultados =
            currentList.filter(item => {

                const nome =
                    (
                        item.name || item
                    ).toLowerCase();


                return nome.includes(term);

            });


        render(resultados);

    }


    // ============================================
    // CARREGAR TODOS OS BRAINROTS
    // ============================================

    async function loadData() {

        try {

            showLoading(
                "Carregando lista de memes..."
            );


            const response =
                await fetch(
                    "/api/brainrots"
                );


            if (!response.ok) {

                if (tratarNaoAutorizado(response)) {
                    return;
                }

                throw new Error(
                    "Resposta inválida"
                );

            }


            const data =
                await response.json();


            allBrainrots =
                data.brainrots || [];


            currentList =
                [...allBrainrots];


            totalEl.textContent =
                `${data.total} Memes`;


            render(currentList);


        } catch (err) {

            console.error(err);


            showError(
                "Não foi possível carregar a lista."
            );


            totalEl.textContent =
                "Erro ao carregar";

        }

    }


    // ============================================
    // CARREGAR CATEGORIA
    // ============================================

    async function loadCategory(
        category
    ) {

        currentCategory =
            category;


        setActiveCategoryBtn(
            category
        );


        searchEl.value = "";


        try {


            if (category === "all") {

                currentList =
                    [...allBrainrots];


                render(currentList);

                return;

            }


            showLoading(
                "Carregando categoria..."
            );


            const response =
                await fetch(
                    `/api/brainrots/${encodeURIComponent(
                        category
                    )}`
                );


            if (!response.ok) {

                if (tratarNaoAutorizado(response)) {
                    return;
                }

                throw new Error(
                    "Resposta inválida"
                );

            }


            const data =
                await response.json();


            currentList =
                data.brainrots || [];


            render(currentList);


        } catch (err) {

            console.error(err);


            showError(
                "Não foi possível carregar esta categoria."
            );

        }

    }


    // ============================================
    // CATEGORIA ATIVA
    // ============================================

    function setActiveCategoryBtn(category) {

        categoryButtons.forEach(btn => {

            btn.classList.toggle(
                "active",
                btn.dataset.category === category
            );

        });

    }


    // ============================================
    // DIGITAÇÃO DA PESQUISA
    // ============================================

    searchEl.addEventListener(
        "input",
        e => {

            applySearch(
                e.target.value
            );

        }
    );


    // ============================================
    // REGISTRAR PESQUISA
    // ============================================

    searchEl.addEventListener(
        "keydown",
        e => {


            if (e.key !== "Enter") {
                return;
            }


            const pesquisa =
                searchEl.value.trim();


            if (!pesquisa) {
                return;
            }


            registrarDado({

                pesquisa:
                    pesquisa,

                brainrot_clicado:
                    ""

            });


            console.log(
                "🔎 Pesquisa registrada:",
                pesquisa
            );


        }
    );


    // ============================================
    // BOTÕES DE CATEGORIA
    // ============================================

    categoryButtons.forEach(btn => {


        btn.addEventListener(
            "click",
            () => {

                loadCategory(
                    btn.dataset.category
                );

            }
        );


    });


    // ============================================
    // INICIAR SITE
    // ============================================

    setAuthMode("login");

    checkSession();


</script>


</body>

</html>
