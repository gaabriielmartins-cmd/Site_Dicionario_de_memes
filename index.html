<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dicionário dos Memes</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            padding: 30px;
            text-align: center;
            background: #181818;
            border-bottom: 1px solid #2a2a2a;
            position: relative;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
        }

        #total {
            color: #aaa;
            font-size: 1rem;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px;
        }

        .search {
            width: 100%;
            padding: 15px 18px;
            border-radius: 10px;
            border: 1px solid #333;
            font-size: 18px;
            margin-bottom: 15px;
            background: #222;
            color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        .search:focus {
            border-color: #666;
        }

        .search::placeholder {
            color: #777;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #292929;
            color: white;
            font-size: 15px;
            transition: all 0.2s;
        }

        button:hover {
            background: #444;
        }

        button.active {
            background: #4a6fa5;
            box-shadow: 0 0 0 2px #6b9bd666;
        }

        #grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .card {
            background: #1d1d1d;
            border-radius: 12px;
            padding: 18px;
            border: 1px solid #333;
            transition: 0.2s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: #777;
            background: #222;
        }

        .card:active {
            transform: translateY(-1px);
        }

        .number {
            color: #777;
            font-size: 12px;
        }

        .name {
            margin-top: 8px;
            font-size: 17px;
            font-weight: bold;
            word-break: break-word;
        }

        .category {
            margin-top: 10px;
            font-size: 12px;
            color: #aaa;
            display: inline-block;
            padding: 3px 8px;
            background: #2a2a2a;
            border-radius: 6px;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #777;
            font-size: 16px;
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #aaa;
            font-size: 16px;
        }

        .error {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #ff6b6b;
            font-size: 16px;
        }

        /* ============================================ */
        /* CABEÇALHO DO USUÁRIO LOGADO */
        /* ============================================ */

        .user-bar {
            position: absolute;
            top: 18px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #ccc;
        }

        .user-bar button {
            padding: 6px 12px;
            font-size: 13px;
            background: #3a2323;
        }

        .user-bar button:hover {
            background: #5a2f2f;
        }

        /* ============================================ */
        /* TELA DE LOGIN / CADASTRO */
        /* ============================================ */

        #auth-overlay {
            position: fixed;
            inset: 0;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        #auth-overlay.hidden {
            display: none;
        }

        .auth-box {
            width: 100%;
            max-width: 380px;
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 14px;
            padding: 32px;
        }

        .auth-box h2 {
            margin: 0 0 6px;
            text-align: center;
        }

        .auth-subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .auth-box label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
        }

        .auth-box .search {
            margin-bottom: 16px;
        }

        .auth-submit {
            width: 100%;
            padding: 13px;
            background: #4a6fa5;
            font-size: 16px;
            font-weight: bold;
            margin-top: 4px;
        }

        .auth-submit:hover {
            background: #5a82bd;
        }

        .auth-submit:disabled {
            opacity: 0.6;
            cursor: default;
        }

        /* ============================================ */
        /* BOTÃO GOOGLE */
        /* ============================================ */

        .google-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #fff;
            color: #1f1f1f;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            text-decoration: none;
        }

        .google-btn:hover {
            background: #f1f1f1;
        }

        .google-btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: #777;
            font-size: 12px;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #333;
        }

        .auth-toggle {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #999;
        }

        .auth-toggle a {
            color: #6b9bd6;
            cursor: pointer;
            text-decoration: underline;
        }

        .auth-message {
            min-height: 18px;
            text-align: center;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .auth-message.error {
            color: #ff6b6b;
        }

        .auth-message.success {
            color: #7bd67b;
        }

        #app-content.hidden {
            display: none;
        }

        /* ============================================ */
        /* MODAL DE IMAGEM DO MEME */
        /* ============================================ */

        #meme-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        #meme-modal.hidden {
            display: none;
        }

        .meme-modal-box {
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 14px;
            max-width: 480px;
            width: 100%;
            overflow: hidden;
            position: relative;
            text-align: center;
        }

        .meme-modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #292929;
            border: none;
            color: #fff;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            z-index: 1;
        }

        .meme-modal-close:hover {
            background: #444;
        }

        .meme-modal-img-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .meme-modal-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .meme-modal-placeholder {
            font-size: 60px;
        }

        .meme-modal-name {
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
        }

        .meme-modal-category {
            padding-top: 18px;
            color: #aaa;
            font-size: 13px;
            text-transform: capitalize;
        }

        .meme-modal-upload {
            padding: 0 18px 20px;
        }

        .meme-upload-btn {
            width: 100%;
            background: #292929;
            border: 1px dashed #444;
            padding: 12px;
            font-size: 14px;
        }

        .meme-upload-btn:hover {
            background: #333;
            border-color: #666;
        }

        .meme-upload-status {
            margin-top: 10px;
            font-size: 13px;
            min-height: 16px;
        }

        .meme-upload-status.success {
            color: #7bd67b;
        }

        .meme-upload-status.error {
            color: #ff6b6b;
        }

    </style>
</head>


<body>


<!-- ====================================== -->
<!-- TELA DE LOGIN / CADASTRO -->
<!-- ====================================== -->

<div id="auth-overlay" class="hidden">

    <div class="auth-box">

        <h2 id="auth-title">Entrar</h2>

        <div id="auth-subtitle" class="auth-subtitle">
            Faça login para ver os memes
        </div>

        <div id="auth-message" class="auth-message"></div>

        <!-- BOTÃO DE LOGIN COM GOOGLE -->
        <a
            id="google-login-btn"
            class="google-btn"
            href="/api/login/google"
        >
            <svg viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12
                    c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24
                    c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039
                    l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36
                    c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571
                    c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24
                    C44,22.659,43.862,21.35,43.611,20.083z"/>
            </svg>
            Continuar com o Google
        </a>

        <div class="auth-divider">ou</div>

        <form id="auth-form" autocomplete="on">

            <label for="auth-username">E-mail</label>

            <input
                id="auth-username"
                class="search"
                type="email"
                placeholder="seuemail@exemplo.com"
                autocomplete="email"
                required
            >

            <label for="auth-password">Senha</label>

            <input
                id="auth-password"
                class="search"
                type="password"
                placeholder="Sua senha"
                autocomplete="current-password"
                required
            >

            <div id="auth-confirm-wrap" style="display: none;">

                <label for="auth-confirm">Confirmar senha</label>

                <input
                    id="auth-confirm"
                    class="search"
                    type="password"
                    placeholder="Confirme sua senha"
                    autocomplete="new-password"
                >

            </div>

            <button
                id="auth-submit-btn"
                type="submit"
                class="auth-submit"
            >
                Entrar
            </button>

        </form>

        <div class="auth-toggle">

            <span id="auth-toggle-login-text">
                Ainda não tem conta?
                <a id="auth-toggle-link">Cadastre-se</a>
            </span>

        </div>

    </div>

</div>


<!-- ====================================== -->
<!-- MODAL COM A IMAGEM DO MEME -->
<!-- ====================================== -->

<div id="meme-modal" class="hidden">

    <div class="meme-modal-box">

        <button id="meme-modal-close" class="meme-modal-close" type="button">
            ✕
        </button>

        <div id="meme-modal-img-wrap" class="meme-modal-img-wrap">
            <!-- img ou placeholder entram aqui via JS -->
        </div>

        <div id="meme-modal-name" class="meme-modal-name"></div>

        <div id="meme-modal-category" class="meme-modal-category"></div>

        <div class="meme-modal-upload">

            <input
                type="file"
                id="meme-upload-input"
                accept="image/jpeg,image/png,image/webp"
                hidden
            >

            <button
                id="meme-upload-btn"
                type="button"
                class="meme-upload-btn"
            >
                📤 Adicionar / trocar imagem
            </button>

            <div id="meme-upload-status" class="meme-upload-status"></div>

        </div>

    </div>

</div>


<!-- ====================================== -->
<!-- CONTEÚDO PRINCIPAL DO SITE -->
<!-- ====================================== -->

<div id="app-content" class="hidden">


    <header>

        <h1>
            📂🌐 Todos os Memes 🌐📂
        </h1>

        <div id="total">
            Carregando...
        </div>

        <div class="user-bar">

            <span id="user-label"></span>

            <button id="logout-btn" type="button">
                Sair
            </button>

        </div>

    </header>


    <div class="container">


        <!-- ====================================== -->
        <!-- PESQUISA -->
        <!-- ====================================== -->

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Pesquisar Memes..."
            aria-label="Pesquisar Memes"
            autocomplete="off"
        >


        <!-- ====================================== -->
        <!-- FILTROS -->
        <!-- ====================================== -->

        <div
            class="filters"
            role="group"
            aria-label="Filtros por categoria"
        >

            <button
                data-category="all"
                class="active"
            >
                Todos
            </button>

            <button data-category="common">
                Common
            </button>

            <button data-category="rare">
                Rare
            </button>

            <button data-category="epic">
                Epic
            </button>

            <button data-category="legendary">
                Legendary
            </button>

            <button data-category="mythic">
                Mythic
            </button>

            <button data-category="brainrot_god">
                Brainrot God
            </button>

            <button data-category="secret">
                Secret
            </button>

            <button data-category="og">
                OG
            </button>

        </div>


        <!-- ====================================== -->
        <!-- LISTA -->
        <!-- ====================================== -->

        <div id="grid"></div>


    </div>

</div>


<script>

    // ============================================
    // VARIÁVEIS
    // ============================================

    let allBrainrots = [];

    let currentList = [];

    let currentCategory = "all";

    let authMode = "login"; // "login" ou "register"


    const totalEl =
        document.getElementById("total");

    const gridEl =
        document.getElementById("grid");

    const searchEl =
        document.getElementById("search");

    const categoryButtons =
        document.querySelectorAll(
            "[data-category]"
        );

    const authOverlay =
        document.getElementById("auth-overlay");

    const appContent =
        document.getElementById("app-content");

    const authForm =
        document.getElementById("auth-form");

    const authTitle =
        document.getElementById("auth-title");

    const authSubtitle =
        document.getElementById("auth-subtitle");

    const authMessage =
        document.getElementById("auth-message");

    const authUsername =
        document.getElementById("auth-username");

    const authPassword =
        document.getElementById("auth-password");

    const authConfirmWrap =
        document.getElementById("auth-confirm-wrap");

    const authConfirm =
        document.getElementById("auth-confirm");

    const authSubmitBtn =
        document.getElementById("auth-submit-btn");

    const authToggleText =
        document.getElementById("auth-toggle-login-text");

    const authToggleLink =
        document.getElementById("auth-toggle-link");

    const userLabel =
        document.getElementById("user-label");

    const logoutBtn =
        document.getElementById("logout-btn");


    // ============================================
    // MODAL DE IMAGEM
    // ============================================

    const memeModal =
        document.getElementById("meme-modal");

    const memeModalImgWrap =
        document.getElementById("meme-modal-img-wrap");

    const memeModalName =
        document.getElementById("meme-modal-name");

    const memeModalCategory =
        document.getElementById("meme-modal-category");

    const memeModalClose =
        document.getElementById("meme-modal-close");

    const memeUploadInput =
        document.getElementById("meme-upload-input");

    const memeUploadBtn =
        document.getElementById("meme-upload-btn");

    const memeUploadStatus =
        document.getElementById("meme-upload-status");


    // Guarda o nome do meme que está aberto no modal no momento,
    // para saber pra qual meme vale o upload de imagem.

    let modalMemeAtual = "";


    // Ordem de extensões que tentamos carregar (a primeira que
    // existir é usada).

    const EXTENSOES_IMAGEM =
        ["jpg", "jpeg", "png", "webp"];


    // Transforma "Tralalero Tralala" em "tralalero-tralala"
    // (é assim que o arquivo de imagem deve se chamar
    // dentro de /static/images/)

    function slugify(nome) {

        return nome
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "") // remove acentos
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/(^-|-$)/g, "");

    }


    function abrirModalImagem(nomeBrainrot, categoria) {

        modalMemeAtual =
            nomeBrainrot;

        memeModalName.textContent =
            nomeBrainrot;

        memeModalCategory.textContent =
            categoria
                ? categoria.replace(/_/g, " ")
                : "";

        memeUploadStatus.textContent = "";

        memeUploadStatus.className =
            "meme-upload-status";

        carregarImagemComFallback(
            slugify(nomeBrainrot),
            EXTENSOES_IMAGEM
        );

        memeModal.classList.remove("hidden");

    }


    // ============================================
    // CARREGAR IMAGEM TENTANDO VÁRIAS EXTENSÕES
    // ============================================
    // Como o usuário pode enviar jpg, png ou webp, tentamos
    // cada extensão em ordem até uma funcionar. Se nenhuma
    // existir, mostramos o placeholder.

    function carregarImagemComFallback(
        slug,
        extensoesRestantes,
        cacheBuster
    ) {

        if (!extensoesRestantes.length) {

            memeModalImgWrap.innerHTML = `
                <div class="meme-modal-placeholder">
                    🖼️
                </div>
            `;

            return;

        }

        const [
            extensaoAtual,
            ...proximasExtensoes
        ] = extensoesRestantes;

        const query =
            cacheBuster
                ? `?v=${cacheBuster}`
                : "";

        const img =
            new Image();

        img.alt = slug;

        img.onload = () => {

            memeModalImgWrap.innerHTML = "";

            memeModalImgWrap.appendChild(img);

        };

        img.onerror = () => {

            carregarImagemComFallback(
                slug,
                proximasExtensoes,
                cacheBuster
            );

        };

        img.src =
            `/static/images/${slug}.${extensaoAtual}${query}`;

    }


    // ============================================
    // ENVIAR IMAGEM ESCOLHIDA PELO USUÁRIO
    // ============================================

    async function enviarImagem(arquivo) {

        memeUploadStatus.textContent =
            "Enviando...";

        memeUploadStatus.className =
            "meme-upload-status";

        const formData =
            new FormData();

        formData.append("nome", modalMemeAtual);

        formData.append("imagem", arquivo);

        try {

            const response =
                await fetch("/api/upload-imagem", {

                    method: "POST",

                    body: formData

                });

            const data =
                await response.json();

            if (!response.ok) {

                if (tratarNaoAutorizado(response)) {
                    return;
                }

                memeUploadStatus.textContent =
                    data.error || "Erro ao enviar imagem.";

                memeUploadStatus.className =
                    "meme-upload-status error";

                return;

            }

            memeUploadStatus.textContent =
                "Imagem atualizada! ✅";

            memeUploadStatus.className =
                "meme-upload-status success";

            // Recarrega a imagem já com cache-busting, pra
            // aparecer a nova imagem na hora.

            carregarImagemComFallback(
                slugify(modalMemeAtual),
                EXTENSOES_IMAGEM,
                Date.now()
            );

        } catch (err) {

            console.error(err);

            memeUploadStatus.textContent =
                "Não foi possível enviar a imagem.";

            memeUploadStatus.className =
                "meme-upload-status error";

        }

    }


    memeUploadBtn.addEventListener(
        "click",
        () => {

            memeUploadInput.click();

        }
    );


    memeUploadInput.addEventListener(
        "change",
        async () => {

            const arquivo =
                memeUploadInput.files[0];

            if (!arquivo) {
                return;
            }

            await enviarImagem(arquivo);

            memeUploadInput.value = "";

        }
    );


    function fecharModalImagem() {

        memeModal.classList.add("hidden");

        memeModalImgWrap.innerHTML = "";

    }


    memeModalClose.addEventListener(
        "click",
        fecharModalImagem
    );


    // Fecha clicando fora da caixinha
    memeModal.addEventListener("click", (e) => {

        if (e.target === memeModal) {
            fecharModalImagem();
        }

    });


    // Fecha com ESC
    document.addEventListener("keydown", (e) => {

        if (e.key === "Escape") {
            fecharModalImagem();
        }

    });


    // ============================================
    // MOSTRAR TELA DE LOGIN OU O SITE
    // ============================================

    function showAuthScreen() {

        authOverlay.classList.remove("hidden");

        appContent.classList.add("hidden");

    }


    function showApp(username) {

        authOverlay.classList.add("hidden");

        appContent.classList.remove("hidden");

        userLabel.textContent =
            `👤 ${username}`;

        loadData();

    }


    // ============================================
    // ALTERNAR ENTRE LOGIN E CADASTRO
    // ============================================

    function setAuthMode(mode) {

        authMode = mode;

        authMessage.textContent = "";

        authMessage.className = "auth-message";

        if (mode === "register") {

            authTitle.textContent = "Criar Conta";

            authSubtitle.textContent =
                "Cadastre-se para ver os memes";

            authConfirmWrap.style.display = "block";

            authConfirm.required = true;

            authSubmitBtn.textContent = "Cadastrar";

            authToggleText.innerHTML =
                'Já tem conta? <a id="auth-toggle-link">Entrar</a>';

        } else {

            authTitle.textContent = "Entrar";

            authSubtitle.textContent =
                "Faça login para ver os memes";

            authConfirmWrap.style.display = "none";

            authConfirm.required = false;

            authSubmitBtn.textContent = "Entrar";

            authToggleText.innerHTML =
                'Ainda não tem conta? <a id="auth-toggle-link">Cadastre-se</a>';

        }

        // Precisa religar o listener pois o link foi recriado
        document
            .getElementById("auth-toggle-link")
            .addEventListener("click", () => {

                setAuthMode(
                    authMode === "login" ? "register" : "login"
                );

            });

    }


    // ============================================
    // MOSTRAR ERRO VINDO DO REDIRECT DO GOOGLE
    // ============================================

    function checkGoogleAuthError() {

        const params =
            new URLSearchParams(window.location.search);

        if (params.get("auth_error") === "google") {

            authMessage.textContent =
                "Não foi possível entrar com o Google. Tente novamente.";

            authMessage.className =
                "auth-message error";

            // Limpa o parâmetro da URL sem recarregar a página
            params.delete("auth_error");

            const novaUrl =
                window.location.pathname +
                (params.toString() ? `?${params}` : "");

            window.history.replaceState(
                {}, document.title, novaUrl
            );

        }

    }


    // ============================================
    // VERIFICAR SE JÁ ESTÁ LOGADO
    // ============================================

    async function checkSession() {

        try {

            const response =
                await fetch("/api/session");

            const data =
                await response.json();

            if (data.logged_in) {

                showApp(data.email);

            } else {

                showAuthScreen();

                checkGoogleAuthError();

            }

        } catch (err) {

            console.error(err);

            showAuthScreen();

        }

    }


    // ============================================
    // ENVIAR FORMULÁRIO DE LOGIN / CADASTRO
    // ============================================

    authForm.addEventListener("submit", async (e) => {

        e.preventDefault();

        const username =
            authUsername.value.trim();

        const password =
            authPassword.value;

        authMessage.textContent = "";

        authMessage.className = "auth-message";

        if (authMode === "register") {

            const confirm =
                authConfirm.value;

            if (password !== confirm) {

                authMessage.textContent =
                    "As senhas não conferem.";

                authMessage.className =
                    "auth-message error";

                return;

            }

        }

        const endpoint =
            authMode === "register"
                ? "/api/register"
                : "/api/login";

        authSubmitBtn.disabled = true;

        try {

            const response =
                await fetch(endpoint, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: username,
                        password
                    })

                });

            const data =
                await response.json();

            if (!response.ok) {

                authMessage.textContent =
                    data.error || "Ocorreu um erro.";

                authMessage.className =
                    "auth-message error";

                return;

            }

            authForm.reset();

            showApp(data.email);

        } catch (err) {

            console.error(err);

            authMessage.textContent =
                "Não foi possível conectar ao servidor.";

            authMessage.className =
                "auth-message error";

        } finally {

            authSubmitBtn.disabled = false;

        }

    });


    // ============================================
    // LOGOUT
    // ============================================

    logoutBtn.addEventListener("click", async () => {

        try {

            await fetch("/api/logout", {
                method: "POST"
            });

        } catch (err) {

            console.error(err);

        }

        authUsername.value = "";

        authPassword.value = "";

        setAuthMode("login");

        showAuthScreen();

    });


    // ============================================
    // LOADING
    // ============================================

    function showLoading(
        message = "Carregando..."
    ) {

        gridEl.innerHTML = `
            <div class="loading">
                ${message}
            </div>
        `;

    }


    // ============================================
    // ERRO
    // ============================================

    function showError(
        message = "Erro ao carregar os dados."
    ) {

        gridEl.innerHTML = `
            <div class="error">
                ❌ ${message}
            </div>
        `;

    }


    // ============================================
    // ESCAPAR HTML
    // ============================================

    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


    // ============================================
    // TRATAR RESPOSTA NÃO AUTORIZADA (SESSÃO EXPIROU)
    // ============================================

    function tratarNaoAutorizado(response) {

        if (response.status === 401) {

            setAuthMode("login");

            showAuthScreen();

            return true;

        }

        return false;

    }


    // ============================================
    // ENVIAR DADOS PARA O FLASK
    // ============================================

    async function registrarDado(dados) {

        try {

            const response =
                await fetch(
                    "/api/gravar",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            pesquisa:
                                dados.pesquisa || "",

                            brainrot_clicado:
                                dados.brainrot_clicado || ""

                        })
                    }
                );


            if (!response.ok) {

                if (tratarNaoAutorizado(response)) {
                    return;
                }

                console.error(
                    "Erro ao gravar dados:",
                    response.status
                );

                return;

            }


            const resultado =
                await response.json();


            console.log(
                "✅ Dados registrados:",
                resultado
            );


        } catch (erro) {

            console.error(
                "❌ Erro ao enviar dados para o Flask:",
                erro
            );

        }

    }


    // ============================================
    // RENDERIZAR BRAINROTS
    // ============================================

    function render(lista) {

        gridEl.innerHTML = "";


        if (!lista.length) {

            gridEl.innerHTML = `
                <div class="empty">
                    Nenhum meme encontrado 😕
                </div>
            `;

            return;

        }


        lista.forEach((item, index) => {


            /*
             * O Flask atualmente retorna strings:
             *
             * "Noobini Pizzanini"
             *
             * Por isso usamos:
             *
             * item.name || item
             */

            const nomeBrainrot =
                item.name || item;

            const categoriaBrainrot =
                item.category || currentCategory;


            const card =
                document.createElement("div");


            card.className =
                "card";


            // ====================================
            // CLIQUE NO BRAINROT
            // ====================================

            card.addEventListener(
                "click",
                () => {

                    const pesquisaAtual =
                        searchEl.value.trim();


                    registrarDado({

                        pesquisa:
                            pesquisaAtual,

                        brainrot_clicado:
                            nomeBrainrot

                    });


                    abrirModalImagem(
                        nomeBrainrot,
                        categoriaBrainrot === "all"
                            ? ""
                            : categoriaBrainrot
                    );

                }
            );


            // ====================================
            // CONTEÚDO DO CARD
            // ====================================

            card.innerHTML = `

                <div class="number">
                    #${index + 1}
                </div>

                <div class="name">
                    ${escapeHtml(nomeBrainrot)}
                </div>

                ${
                    item.category
                    ?
                    `
                    <div class="category">
                        ${escapeHtml(
                            item.category
                        )}
                    </div>
                    `
                    :
                    ""
                }

            `;


            gridEl.appendChild(card);


        });

    }


    // ============================================
    // PESQUISA LOCAL
    // ============================================

    function applySearch(query) {

        const term =
            query.trim().toLowerCase();


        if (!term) {

            render(currentList);

            return;

        }


        const resultados =
            currentList.filter(item => {

                const nome =
                    (
                        item.name || item
                    ).toLowerCase();


                return nome.includes(term);

            });


        render(resultados);

    }


    // ============================================
    // CARREGAR TODOS OS BRAINROTS
    // ============================================

    async function loadData() {

        try {

            showLoading(
                "Carregando lista de memes..."
            );


            const response =
                await fetch(
                    "/api/brainrots"
                );


            if (!response.ok) {

                if (tratarNaoAutorizado(response)) {
                    return;
                }

                throw new Error(
                    "Resposta inválida"
                );

            }


            const data =
                await response.json();


            allBrainrots =
                data.brainrots || [];


            currentList =
                [...allBrainrots];


            totalEl.textContent =
                `${data.total} Memes`;


            render(currentList);


        } catch (err) {

            console.error(err);


            showError(
                "Não foi possível carregar a lista."
            );


            totalEl.textContent =
                "Erro ao carregar";

        }

    }


    // ============================================
    // CARREGAR CATEGORIA
    // ============================================

    async function loadCategory(
        category
    ) {

        currentCategory =
            category;


        setActiveCategoryBtn(
            category
        );


        searchEl.value = "";


        try {


            if (category === "all") {

                currentList =
                    [...allBrainrots];


                render(currentList);

                return;

            }


            showLoading(
                "Carregando categoria..."
            );


            const response =
                await fetch(
                    `/api/brainrots/${encodeURIComponent(
                        category
                    )}`
                );


            if (!response.ok) {

                if (tratarNaoAutorizado(response)) {
                    return;
                }

                throw new Error(
                    "Resposta inválida"
                );

            }


            const data =
                await response.json();


            currentList =
                data.brainrots || [];


            render(currentList);


        } catch (err) {

            console.error(err);


            showError(
                "Não foi possível carregar esta categoria."
            );

        }

    }


    // ============================================
    // CATEGORIA ATIVA
    // ============================================

    function setActiveCategoryBtn(category) {

        categoryButtons.forEach(btn => {

            btn.classList.toggle(
                "active",
                btn.dataset.category === category
            );

        });

    }


    // ============================================
    // DIGITAÇÃO DA PESQUISA
    // ============================================

    searchEl.addEventListener(
        "input",
        e => {

            applySearch(
                e.target.value
            );

        }
    );


    // ============================================
    // REGISTRAR PESQUISA
    // ============================================

    searchEl.addEventListener(
        "keydown",
        e => {


            if (e.key !== "Enter") {
                return;
            }


            const pesquisa =
                searchEl.value.trim();


            if (!pesquisa) {
                return;
            }


            registrarDado({

                pesquisa:
                    pesquisa,

                brainrot_clicado:
                    ""

            });


            console.log(
                "🔎 Pesquisa registrada:",
                pesquisa
            );


        }
    );


    // ============================================
    // BOTÕES DE CATEGORIA
    // ============================================

    categoryButtons.forEach(btn => {


        btn.addEventListener(
            "click",
            () => {

                loadCategory(
                    btn.dataset.category
                );

            }
        );


    });


    // ============================================
    // INICIAR SITE
    // ============================================

    setAuthMode("login");

    checkSession();


</script>
