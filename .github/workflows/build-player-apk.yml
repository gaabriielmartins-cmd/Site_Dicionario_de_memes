name: Build Player APK
on:
  push:
    branches: [temp-player-apk-build-20260930]
    paths-ignore:
      - android-player-build/app-debug.apk
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android-player-build
        run: gradle assembleDebug
      - name: Commit APK
        run: |
          cp android-player-build/app/build/outputs/apk/debug/app-debug.apk android-player-build/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-player-build/app-debug.apk
          git commit -m "Build Player APK" || exit 0
          git push
